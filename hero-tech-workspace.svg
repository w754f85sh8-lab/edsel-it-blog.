<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#123b76"/></linearGradient>
  <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1a2d"/><stop offset="1" stop-color="#0d2747"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-opacity=".35"/></filter>
</defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<circle cx="1030" cy="130" r="220" fill="#2563eb" opacity=".18"/>
<circle cx="240" cy="720" r="260" fill="#14b8a6" opacity=".12"/>
<!-- desk -->
<rect x="70" y="560" width="1060" height="150" rx="32" fill="#0b1220"/>
<!-- laptop -->
<g filter="url(#shadow)">
<rect x="505" y="170" width="520" height="330" rx="22" fill="#111827" stroke="#94a3b8" stroke-opacity=".25"/>
<rect x="530" y="195" width="470" height="275" rx="10" fill="url(#screen)"/>
<rect x="450" y="500" width="640" height="42" rx="10" fill="#334155"/>
</g>
<!-- code / charts -->
<g opacity=".95">
<rect x="565" y="230" width="110" height="10" rx="5" fill="#60a5fa"/>
<rect x="565" y="260" width="200" height="8" rx="4" fill="#64748b"/>
<rect x="565" y="284" width="150" height="8" rx="4" fill="#475569"/>
<rect x="565" y="308" width="240" height="8" rx="4" fill="#475569"/>
<polyline points="780,405 830,350 875,390 920,300 965,330" fill="none" stroke="#5eead4" stroke-width="8"/>
<circle cx="830" cy="350" r="7" fill="#5eead4"/><circle cx="920" cy="300" r="7" fill="#5eead4"/>
</g>
<!-- notebook -->
<rect x="260" y="480" width="240" height="170" rx="16" transform="rotate(-6 260 480)" fill="#f8fafc"/>
<g stroke="#94a3b8" stroke-width="4"><line x1="300" y1="525" x2="455" y2="510"/><line x1="302" y1="555" x2="455" y2="540"/><line x1="305" y1="585" x2="430" y2="574"/></g>
<!-- coffee -->
<ellipse cx="1040" cy="565" rx="62" ry="22" fill="#111827"/><rect x="980" y="560" width="120" height="95" rx="20" fill="#172033"/><path d="M1100 580 C1155 575 1155 635 1105 630" fill="none" stroke="#334155" stroke-width="18"/>
<!-- floating tiles -->
<g filter="url(#shadow)">
<rect x="110" y="110" width="250" height="130" rx="24" fill="#0f223b" stroke="#38bdf8" stroke-opacity=".35"/>
<rect x="138" y="145" width="32" height="60" rx="8" fill="#3b82f6"/><rect x="185" y="125" width="32" height="80" rx="8" fill="#60a5fa"/><rect x="232" y="95" width="32" height="110" rx="8" fill="#5eead4"/>
<text x="280" y="166" fill="#e2e8f0" font-size="26" font-family="Arial" font-weight="700">DATA</text>
</g>
</svg>